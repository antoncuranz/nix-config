name: Update packages

# lighter and orca are packaged locally (darwin/*/package.nix), so flake.lock
# updates don't cover them. nix-update bumps version and hash; CI then builds
# both darwin hosts (which verifies each release's code signature) and
# auto-merges the PR. Each package gets its own PR, so one failing update does
# not hold back the other.

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    name: Update ${{ matrix.package }}
    # The sources are aarch64-darwin fixed-output derivations, so computing
    # their hashes needs an Apple Silicon runner.
    runs-on: macos-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: lighter
          - package: orca
            # My fork tags its releases vX.Y.Z-fork.N; without this nix-update
            # may treat the suffix as a prerelease and skip them.
            version-regex: 'v(.*-fork\.[0-9]+)'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - name: Run nix-update
        id: update
        env:
          PACKAGE: ${{ matrix.package }}
          VERSION_REGEX: ${{ matrix.version-regex }}
        run: |
          msg="$RUNNER_TEMP/commit-message"
          args=(--flake --system aarch64-darwin --write-commit-message "$msg")
          if [ -n "$VERSION_REGEX" ]; then args+=(--version-regex "$VERSION_REGEX"); fi
          nix run --inputs-from . nixpkgs#nix-update -- "${args[@]}" "$PACKAGE"
          # nix-update writes the message only when it changed something.
          if [ -f "$msg" ]; then
            {
              echo "title=$(head -n1 "$msg")"
              echo "message<<EOF"
              cat "$msg"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi
      - name: Open pull request
        if: steps.update.outputs.title != ''
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ secrets.GH_TOKEN_FOR_UPDATES }}
          branch: update-${{ matrix.package }}
          delete-branch: true
          title: ${{ steps.update.outputs.title }}
          commit-message: ${{ steps.update.outputs.message }}
          body: ${{ steps.update.outputs.message }}
