name: Serverton

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@d698718aa798980d17dd749f03beae0b51183399 # v31
      - uses: cachix/cachix-action@97e5ff84d02b3b4f9936339f767e17f03c9252ed # v16
        with:
          name: antoncuranz
          skipPush: true
      - name: Build Serverton
        run: nix build .#nixosConfigurations.serverton.config.system.build.toplevel --print-build-logs
      - name: Push runtime closure
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          test -n "$CACHIX_AUTH_TOKEN" || { echo 'CACHIX_AUTH_TOKEN is not configured' >&2; exit 1; }
          cachix push antoncuranz < <(readlink -f result)
