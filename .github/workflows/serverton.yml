name: Serverton

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: antoncuranz
          skipPush: true
      - name: Build Serverton
        run: nix build .#nixosConfigurations.serverton.config.system.build.toplevel --print-build-logs
      - name: Push runtime closure
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          test -n "$CACHIX_AUTH_TOKEN" || { echo 'CACHIX_AUTH_TOKEN is not configured' >&2; exit 1; }
          cachix push antoncuranz < <(readlink -f result)
      - name: Scan Nix closure with vulnxscan
        run: |
          mkdir -p "$RUNNER_TEMP/vulnxscan"
          nix run github:tiiuae/sbomnix/47ebba571175087426b6bc7967b8d80b979ea605#vulnxscan -- \
            "$(readlink -f result)" \
            --out "$RUNNER_TEMP/vulnxscan/findings.csv" \
            --evidence-out "$RUNNER_TEMP/vulnxscan/evidence.json" \
            2>&1 | tee "$RUNNER_TEMP/vulnxscan/scan.log"
          nix run github:tiiuae/sbomnix/47ebba571175087426b6bc7967b8d80b979ea605#nixgraph -- \
            "$(readlink -f result)" --depth 100 \
            --out "$RUNNER_TEMP/vulnxscan/dependencies.csv"
          python3 scripts/vulnxscan-summary.py "$RUNNER_TEMP/vulnxscan/findings.csv" \
            "$RUNNER_TEMP/vulnxscan/evidence.json" \
            "$RUNNER_TEMP/vulnxscan/dependencies.csv" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload vulnerability scan results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: serverton-vulnxscan
          path: ${{ runner.temp }}/vulnxscan/
          if-no-files-found: ignore
